    <script>
      (function () {
        const D = 34;
        const T = { subj: 3.6, viz: 7.6, vizEnd: 18.6, pts: 18.6, take: 28.2 };
        const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const $ = (s) => document.querySelector(s);
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
        const SVGNS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
        const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        const GLYPHS = { filosofi: "Φ", studie: "σ", begrepp: "∞", myt: "?" };
        $("#glyph").textContent = GLYPHS[v.kind] || "σ";

        // ---------- number helpers (Swedish format: "1 000", "2,5") ----------
        const parseNum = (s) => {
          const m = String(s || "").trim().match(/^([^\d]*)(\d+(?:[\s ]\d{3})*(?:,\d+)?)(.*)$/);
          if (!m) return null;
          const raw = m[2].replace(/\s/g, "");
          return { pre: m[1], suf: m[3], dec: raw.includes(",") ? raw.split(",")[1].length : 0, n: parseFloat(raw.replace(",", ".")) };
        };
        const fmt = (p, n) => {
          const f = n.toFixed(p.dec).split(".");
          return p.pre + f[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (p.dec ? "," + f[1] : "") + p.suf;
        };

        // ---------- text fitting (no measuring: fonts may still be loading) ----------
        const fit = (node, base, o) => {
          const text = node.textContent;
          const longest = Math.max(...text.split(/[\s­]+/).map((w) => w.length));
          let size = Math.min(base, (o.col || 850) / (longest * o.em));
          if (o.soft && text.length > o.soft) size = Math.min(size, base * Math.sqrt(o.soft / text.length));
          node.style.fontSize = Math.max(o.min, Math.floor(size)) + "px";
        };
        const words = (node, text) => {
          node.innerHTML = "";
          text.trim().split(/\s+/).forEach((w) => node.appendChild(el("span", "w", w)));
          return node.querySelectorAll(".w");
        };

        // ---------- hook / subject / points / takeaway text ----------
        const hookEl = $("#hook-text");
        const hookWords = words(hookEl, v.hook || hookEl.textContent);
        fit(hookEl, 100, { em: 0.62, soft: 78, min: 72 });
        if (v.title) $("#subj-title").textContent = v.title;
        fit($("#subj-title"), 124, { em: 0.56, soft: 22, min: 72 });
        if (v.takeaway) $("#take-mark").textContent = v.takeaway;
        fit($("#take-text"), 84, { em: 0.62, soft: 46, min: 60 });
        ["p1", "p2", "p3"].forEach((k, i) => {
          const t = $("#pt" + (i + 1) + " .pt-t");
          if (v[k]) t.textContent = v[k];
          fit(t, 48, { col: 650, em: 0.6, soft: 80, min: 40 });
        });

        const statStr = (v.stat !== undefined ? v.stat : "65 %").trim();
        const statP = parseNum(statStr);
        if (!statStr) $("#stat-wrap").style.display = "none";
        else $("#stat").textContent = statStr;

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#orb-a", { x: 0, y: 0, scale: 1 }, { x: 260, y: 180, scale: 1.15, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#orb-b", { x: 0, y: 0, scale: 1.1 }, { x: -320, y: -260, scale: 0.95, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#ring", { rotation: 0 }, { rotation: 140, duration: D, ease: "none" }, 0);
        tl.fromTo("#glyph", { y: 0 }, { y: -120, duration: D, ease: "none" }, 0);
        tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: D, ease: "none" }, 0);

        // beat 1 — hook: readable at frame 0, words settle in
        tl.fromTo(hookWords, { opacity: 0.8, y: 12 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.07, ease: "power3.out" }, 0);
        tl.fromTo("#hook-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.5);
        tl.fromTo("#hook-text", { scale: 1 }, { scale: 1.04, duration: 3.6, ease: "none", transformOrigin: "0% 50%" }, 0);
        tl.to(["#hook-text", "#hook-bar"], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 3.25);

            const zs = z.zones || [];
            zone.textContent = zs.length ? zs[Math.min(zs.length - 1, Math.floor(o.f * zs.length * 0.9999))] : "";
            zone.style.color = o.f > 0.8 ? "#ff5a5a" : o.f > 0.5 ? "#ffd166" : "#6ee7a8";
            needle.setAttribute("transform", `rotate(${o.f * 180} ${cx} ${cy})`);
            live.setAttribute("stroke-dashoffset", len * (1 - o.f));
          };
          show();
          tl.fromTo(svg, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
          tl.fromTo([val, zone], { opacity: 0 }, { opacity: 1, duration: 0.4 }, t + 0.3);
          tl.fromTo(o, { f: 0 }, { f: frac, duration: 5.2, ease: "power1.in", onUpdate: show }, t + 0.6);
          tl.fromTo(svg, { x: 0 }, { x: 6, duration: 0.05, repeat: 9, yoyo: true, ease: "none" }, t + 5.8);
          return t + 6.4;
        }

        function RENDER_TIMELINE(z, t) {
          const box = el("div", "tl");
          const line = el("div", "tl-line"); box.appendChild(line);
          const n = z.ev.length, each = Math.min(1.7, 6.6 / n);
          z.ev.forEach((e, i) => {
            const ev = el("div", "ev");
            ev.append(el("div", "ev-dot"), el("div", "ev-t", e.t), el("div", "ev-d", e.d));
            box.appendChild(ev);
            tl.fromTo(ev, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t + 0.3 + i * each);
            tl.fromTo(ev.querySelector(".ev-dot"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, t + 0.3 + i * each);
          });
          stage.appendChild(box);
          tl.fromTo(line, { scaleY: 0 }, { scaleY: 1, duration: 0.3 + n * each, ease: "none" }, t + 0.2);
          return t + 0.3 + (n - 1) * each + 1.0;
        }

        function RENDER_SPECTRUM(z, t) {
          const n = z.rows.length, each = Math.min(2.2, 6.6 / n);
          z.rows.forEach(([l, m, r], i) => {
            const row = el("div", "sp-row");
            const labs = el("div", "sp-labels");
            const mid = el("div", "sp-mid", m);
            labs.append(el("div", null, l), mid, el("div", null, r));
            const track = el("div", "sp-track"); const knob = el("div", "sp-knob"); track.appendChild(knob);
            row.append(labs, track); stage.appendChild(row);
            const at = t + 0.2 + i * each;
            tl.fromTo(row, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, at);
            tl.fromTo(knob, { x: 0 }, { x: 850, duration: 0.6, ease: "power2.inOut" }, at + 0.3);
            tl.to(knob, { x: 425, duration: 0.8, ease: "elastic.out(1, 0.5)" }, at + 0.9);
            tl.fromTo(mid, { color: "rgba(246,243,236,0.62)", scale: 1 }, { color: css("--accent"), scale: 1.12, duration: 0.4, ease: "back.out(2)" }, at + 1.2);
          });
          return t + 0.2 + (n - 1) * each + 1.8;
        }

      })();
    </script>
  </body>
</html>
